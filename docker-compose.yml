# docker compose up --build
#   db        Postgres 16, tuned for analytical batch work
#   pipeline  one-shot: download -> load -> SQL features -> train -> evaluate
#             (idempotent; re-runs skip finished steps)
#   api       FastAPI, starts once the pipeline has finished successfully

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-instacart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-instacart}
      POSTGRES_DB: ${POSTGRES_DB:-instacart}
    command: >
      postgres
      -c shared_buffers=1GB
      -c work_mem=256MB
      -c maintenance_work_mem=1GB
      -c max_wal_size=4GB
      -c effective_cache_size=3GB
    shm_size: 1g
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 127.0.0.1 = reachable from this machine only. On a cloud server this keeps
      # Postgres off the internet (Docker bypasses ufw/firewalld rules).
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  pipeline:
    build:
      context: .
      target: pipeline
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-instacart}:${POSTGRES_PASSWORD:-instacart}@db:5432/${POSTGRES_DB:-instacart}
      USER_SAMPLE_PCT: ${USER_SAMPLE_PCT:-100}
      NN_EPOCHS: ${NN_EPOCHS:-6}
    volumes:
      - data:/app/data
      - artifacts:/app/artifacts
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-instacart}:${POSTGRES_PASSWORD:-instacart}@db:5432/${POSTGRES_DB:-instacart}
    volumes:
      - artifacts:/app/artifacts:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      pipeline:
        condition: service_completed_successfully
    restart: unless-stopped

# Named volumes (not bind mounts) so the non-root container user owns them.
# Copy results out with:  make artifacts
volumes:
  pgdata:
  data:
  artifacts:
